<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Widget Lab</title>
		<!--
			Cascade layer order for the Lab shell (rationale: `src/styles/lab-ui.css`). It is inline on purpose: the
			first `@layer` statement the browser sees fixes the order, and Vite emits the shared PikaCSS chunk's
			stylesheet link BEFORE the Tailwind one, so a statement inside `lab-ui.css` alone would come too late
			and leave Tailwind's `base` above PikaCSS's `utilities`. The Preview frame page has no such statement.
		-->
		<style>
			@layer theme, base, preflights, components, utilities;
		</style>
	</head>
	<body>
		<div id="app" class="isolate"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
