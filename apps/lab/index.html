<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Widget Lab</title>
		<!--
			Cascade layer order for the Lab shell (rationale: `src/styles/lab-ui.css`). It is inline on purpose: the
			first `@layer` statement the browser sees fixes the order, and Vite links the stylesheet of a chunk shared with the
			Preview frame (`tutorial-theme-*.css`) BEFORE the entry's own (Tailwind and `global.css`), so a statement inside
			`lab-ui.css` alone could come too late if an earlier sheet ever declared a layer.
			The Preview frame page has no such statement.
		-->
		<style>
			@layer properties, theme, base, components, utilities;
		</style>
		<!--
			First-paint theme (audit U23). The stylesheet's default palette is the dark one and the light palette only
			applies under `html[data-lab-theme='light']`, which the app sets when its module has loaded; a light-theme user
			therefore saw a dark screen first. This sets the same two things (`data-lab-theme`, `color-scheme`) from the
			same inputs as `resolveLabTheme()` in `src/theme/theme.ts` (the stored `widget-lab:theme`, else the system
			preference, else light) before anything is painted. `theme-bootstrap.unit.test.ts` runs this exact script against
			`resolveLabTheme()`. It must stay in step with `STORAGE_KEY` in `use-lab-theme.ts`.
		-->
		<script>
			(function () {
				var theme = null;
				try {
					var stored = localStorage.getItem('widget-lab:theme');
					if (stored === 'light' || stored === 'dark') theme = stored;
				} catch (error) {
					// Blocked storage: fall through to the system preference.
				}
				if (theme === null) {
					theme = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-lab-theme', theme);
				document.documentElement.style.colorScheme = theme;
			})();
		</script>
	</head>
	<body>
		<div id="app" class="isolate"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
